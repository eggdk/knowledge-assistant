<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识助手 · 嵌入演示</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #233650; font: 16px/1.7 "Microsoft YaHei", system-ui, sans-serif; background: #f5f8fd; }
      header { background: white; border-bottom: 1px solid #e2eaf5; }
      .bar, main { max-width: 1040px; margin: auto; padding-left: 32px; padding-right: 32px; }
      .bar { height: 70px; display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; }
      .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 11px; color: white; background: #2768e8; }
      main { padding-top: 76px; padding-bottom: 100px; }
      .eyebrow { color: #2768e8; font-size: 13px; font-weight: 700; letter-spacing: .12em; }
      h1 { margin: 12px 0 16px; font-size: 38px; line-height: 1.3; color: #142a4c; }
      .lead { max-width: 660px; color: #61718a; font-size: 17px; }
      .card { max-width: 720px; margin-top: 38px; padding: 28px 32px; background: white; border: 1px solid #e1eaf7; border-radius: 16px; box-shadow: 0 12px 36px #244b8910; }
      h2 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 8px 0; }
      pre { overflow: auto; padding: 18px; border-radius: 10px; background: #f2f6fc; color: #30517c; font-size: 13px; }
      .note { color: #6b7a90; font-size: 14px; }
    </style>
    <script src="./embed.js" defer></script>
  </head>
  <body>
    <header><div class="bar"><span class="mark" aria-hidden="true">知</span>知识助手 <span class="note">/ 嵌入演示</span></div></header>
    <main>
      <div class="eyebrow">KNOWLEDGE ASSISTANT</div>
      <h1>让知识触手可及</h1>
      <p class="lead">这是一个普通网页宿主演示。点击右下角的按钮，查看嵌入式知识助手的静态界面。</p>
      <section class="card">
        <h2>在网页中接入</h2>
        <p>将插件静态文件部署到可访问的地址后，在网页中添加一行脚本：</p>
        <pre><code>&lt;script src="https://插件静态文件地址/embed.js" defer&gt;&lt;/script&gt;</code></pre>
        <p class="note">当前仅供界面预览，暂不支持提问，也未连接知识库或后端服务。</p>
      </section>
    </main>
  </body>
</html>
